<head>
  <meta charset="UTF-8">
  <title>Forecasting NYISO</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs/plugin/dayOfYear.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs/plugin/isoWeek.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.10/plugin/utc.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.10/plugin/timezone.js"></script>
</head>
<body>
  <div class="container">
    <h1>Forecast New York City's Power Grid Load for the Next 7 Days using XGBoost!</h1>
        <div class="chart-container">
          <canvas id="weatherChart"></canvas>
          <div id="weatherOverlay">
            <button id="forecastButton">Get Weather Forecast</button>
          </div>
        </div>
        <div id="betweenTwoCharts">
          
          <div id="dates">
            <p>Start Date: <span id="startDateOutput"></span></p>
            <p>End Date: <span id="endDateOutput"></span></p>
          </div>
        </div>
        <div class="chart-container">
          <div id="predictionOverlay">
            <button id="submitDateButton">Predict next 7 days</button>
          </div>
          <canvas id="predictionChart"></canvas>
        </div>
    </div>
      
      <div id="dateError"></div>
    </div>
  </div>

  <script src="frontend.js"></script>
</body>
